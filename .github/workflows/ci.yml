name: SDK checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  language:
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            os: ubuntu-24.04
          - language: python
            os: ubuntu-24.04
          - language: typescript
            os: ubuntu-24.04
          - language: kotlin
            os: ubuntu-24.04
          - language: go
            os: ubuntu-24.04
          - language: c
            os: ubuntu-24.04
          - language: cpp
            os: ubuntu-24.04
          - language: c
            os: macos-26
          - language: cpp
            os: macos-26
          - language: swift
            os: macos-26
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup show
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.7'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: matrix.language == 'typescript'
        with:
          node-version: '22.22.3'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        if: matrix.language == 'kotlin'
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        if: matrix.language == 'go'
        with:
          go-version: '1.27.1'
          cache: false
      - name: Select Xcode and verify Swift 6.3
        if: matrix.language == 'swift'
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: |
          test -d "$DEVELOPER_DIR"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          swift --version
          make doctor-swift
      - name: Setup
        run: make setup-checks setup-${{ matrix.language }}
      - name: Native regression tests
        if: matrix.language != 'typescript'
        run: make test-${{ matrix.language }}
      - name: Node and WASM regression tests
        if: matrix.language == 'typescript'
        run: make test-node test-wasm setup-browser test-browser setup-go setup-c check-generated
      - name: Installed TypeScript and browser consumers with a fresh npm cache
        if: matrix.language == 'typescript'
        env:
          npm_config_cache: ${{ runner.temp }}/arboresce-consumer-npm-cache
        run: make test-typescript-consumer test-browser-consumer
      - name: Package and platform helper regressions
        if: matrix.language == 'typescript'
        run: make test-tooling
      - name: Installed native archive consumer
        if: matrix.language == 'c' || matrix.language == 'cpp'
        run: make test-${{ matrix.language }}-package
      - name: Installed JVM consumer
        if: matrix.language == 'kotlin'
        run: make test-kotlin-consumer
      - name: Formatting and lint
        run: make check-${{ matrix.language }} check-support
